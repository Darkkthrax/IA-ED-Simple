seed: 42

data:
  n_samples: 100000
  n_heldout: 5000
  train_ratio: 0.90
  val_ratio: 0.05
  test_ratio: 0.05
  coeff_min: -5
  coeff_max: 5
  exclude_zero_coeff: true
  max_degree: 4
  max_token_length: 64
  output_dir: data/processed
  family: separable

tokenizer:
  max_int: 20
  special_tokens:
    - PAD
    - SOS
    - EOS
    - UNK

model:
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  max_seq_len: 128

train:
  batch_size: 64
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  scheduler: cosine  # cosine | inv_sqrt
  label_smoothing: 0.1
  grad_clip: 1.0
  log_every: 100
  checkpoint_dir: checkpoints
  resume: null
  num_workers: 2

evaluate:
  beam_size: 5
  max_decode_len: 128
  top_k: 5
  numeric_timeout_s: 2.0
  n_numeric_points: 5

solve:
  beam_size: 5
  max_decode_len: 128
